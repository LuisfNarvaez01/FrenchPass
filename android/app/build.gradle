plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Firebase config (AI Logic, App Check). Kept out of the public repo: CI
// writes it from a secret, and a local build without it still compiles --
// the app then runs with its AI features switched off (see AiBackend).
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

// Release signing is read from android/key.properties when present; otherwise the
// build falls back to the debug keys so a fresh clone still produces a runnable APK.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.frenchpass.french_pass"
    // 37 because permission_handler_android compiles against it; the app
    // still targets 36 (Play's requirement since Aug 2026).
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Required by flutter_local_notifications (java.time backport on API < 26).
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.frenchpass.french_pass"
        // 24 is the floor imposed by the audio plugins; speech_to_text,
        // flutter_tts and permission_handler need 23+.
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Two builds of the same app. "play" is what Google Play distributes: it
    // must not update itself, so it has no installer permission. "github" is
    // the developer's build, published as GitHub Releases and updated
    // in-app; its own package id lets it sit next to the Play install (Play
    // re-signs with Google's key, so one could never update the other).
    flavorDimensions = ["channel"]
    productFlavors {
        play {
            dimension = "channel"
            manifestPlaceholders = [appName: "FrenchPass"]
        }
        github {
            dimension = "channel"
            applicationIdSuffix = ".dev"
            manifestPlaceholders = [appName: "FrenchPass Dev"]
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
