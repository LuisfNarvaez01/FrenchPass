name: french_pass
description: Aprende francés con la palabra del día, práctica de pronunciación y sistema de repetición espaciada.
publish_to: 'none'
version: 2.3.1+18

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0

  # Dependency Injection
  get_it: ^9.3.0

  # Navigation
  go_router: ^18.0.2

  # Persistence — the corpus is a bundled asset, so the only stored state is
  # the learner's progress: a few small JSON documents, no database needed.
  shared_preferences: ^2.3.3

  # Text to speech (French voice)
  flutter_tts: ^4.2.5

  # Speech recognition
  speech_to_text: ^7.0.0

  # Daily reminder
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2


  # Permissions (microphone, notifications)
  permission_handler: ^13.0.2

  # UI
  google_fonts: ^9.0.0
  flutter_animate: ^4.5.0

  intl: ^0.20.3

  # In-app update check (GitHub Releases) and APK download/install.
  package_info_plus: ^10.2.2
  http: ^1.2.2
  path_provider: ^2.1.4

  # Android home-screen widget: shows the word of the day without opening
  # the app.
  home_widget: ^0.10.0

  # AI tutor: record streams raw PCM from the mic; flutter_pcm_sound plays
  # the tutor's PCM audio as it streams in.
  record: ^7.1.2
  flutter_pcm_sound: ^3.3.3
  web_socket_channel: ^3.0.3
  flutter_timezone: ^5.1.1
  firebase_core: ^4.15.0
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  stream_channel: ^2.1.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/words_seed.json
    - assets/data/false_friends.json
    - assets/data/grammar.json
    - assets/data/readings.json
    - assets/data/journey/
    - assets/data/placement.json
    - assets/images/mascot.png
    - assets/images/mascot_cool.png
    - assets/images/mascot_thinking.png
