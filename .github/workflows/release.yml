name: Build and release

# Every push to main builds both flavors (android/app/build.gradle):
#
# - "github": published as a GitHub Release. The installed GitHub build
#   checks Releases and offers to update itself (UpdateService), so this is
#   how a change reaches the developer's phone without a manual rebuild.
# - "play": an obfuscated app bundle, attached to the workflow run as an
#   artifact, to upload to Google Play Console by hand.
on:
  push:
    branches: [main]
    # The privacy policy and store docs are served by GitHub Pages; editing
    # them shouldn't ship a new app version.
    paths-ignore: ['docs/**']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      # The release keystore is never committed (see android/.gitignore) --
      # it is decoded here from a repo secret into the exact path
      # android/app/build.gradle expects, so CI produces an APK signed with
      # the same certificate as the one already on a tester's phone.
      # Without this, "updating" over an existing install would fail with a
      # signature mismatch and require an uninstall first.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is empty or missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/frenchpass-release.jks


      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=frenchpass-release.jks
          EOF

      # Fail here, with a readable message, rather than deep inside Gradle's
      # signing task where the cause is buried in the log.
      - name: Verify signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for name in KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or missing."
              exit 1
            fi
          done
          keytool -list -keystore android/app/frenchpass-release.jks             -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null             || { echo "::error::Keystore could not be opened with KEYSTORE_PASSWORD / KEY_ALIAS -- check the secrets match the local key."; exit 1; }

      # Firebase config (AI Logic + App Check). Not secret in the way a key
      # is -- App Check is what protects the AI -- but it stays out of the
      # public repo all the same. Without it the app builds with its AI
      # features off, which is never what a release should ship.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is empty or missing (paste the whole google-services.json)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          grep -q '"com.frenchpass.french_pass"' android/app/google-services.json             && grep -q '"com.frenchpass.french_pass.dev"' android/app/google-services.json             || { echo "::error::google-services.json must list both com.frenchpass.french_pass and com.frenchpass.french_pass.dev."; exit 1; }

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Build GitHub APKs
        run: flutter build apk --release --flavor github --split-per-abi

      # Obfuscated: the Play build is the one strangers download. The symbol
      # files are kept with the bundle so crash stack traces can be decoded.
      - name: Build Play app bundle
        run: |
          flutter build appbundle --release --flavor play             --obfuscate --split-debug-info=build/symbols

      - name: Keep Play bundle and symbols
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: |
            build/app/outputs/bundle/playRelease/app-play-release.aab
            build/symbols/
          retention-days: 90

      - name: Read app version
        id: version
        run: |
          # Tag with the marketing version only ("v1.3.0", not "v1.3.0+4"):
          # it is what the in-app update prompt shows the learner.
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FrenchPass ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-github-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-github-release.apk
            build/app/outputs/flutter-apk/app-x86_64-github-release.apk
