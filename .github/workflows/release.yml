name: Build and release APK

# Every push to main is a release: FrenchPass checks GitHub Releases for a
# newer tag and offers to download+install it in-app (see
# lib/core/services/update_service.dart), so a new release here is how a
# change actually reaches an installed phone without a manual rebuild.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      # The release keystore is never committed (see android/.gitignore) --
      # it is decoded here from a repo secret into the exact path
      # android/app/build.gradle expects, so CI produces an APK signed with
      # the same certificate as the one already on a tester's phone.
      # Without this, "updating" over an existing install would fail with a
      # signature mismatch and require an uninstall first.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is empty or missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/frenchpass-release.jks


      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=frenchpass-release.jks
          EOF

      # Fail here, with a readable message, rather than deep inside Gradle's
      # signing task where the cause is buried in the log.
      - name: Verify signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for name in KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or missing."
              exit 1
            fi
          done
          keytool -list -keystore android/app/frenchpass-release.jks             -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null             || { echo "::error::Keystore could not be opened with KEYSTORE_PASSWORD / KEY_ALIAS -- check the secrets match the local key."; exit 1; }

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FrenchPass ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
